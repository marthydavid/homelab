apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  target:
    name: cloudflared-token
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
  - remoteRef:
      key: secret/cloudflare
      property: tunnel_token
    secretKey: token
---
# Remotely-managed tunnel: the public hostname -> service routes are set in the
# Zero Trust dashboard (see README.md); this pod only needs the tunnel token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2025.9.1
        args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
