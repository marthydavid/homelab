apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  labels:
    app.kubernetes.io/instance: vault
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vault
    helm.sh/chart: vault-0.34.1
  name: vault
  namespace: vault
spec:
  ingressClassName: nginx
  rules:
    - host: vault.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: vault-active
                port:
                  number: 8200
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - vault.marthy.xyz
      secretName: vault-tls
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
  name: vault-server-test
  namespace: vault
spec:
  containers:
    - command:
        - /bin/sh
        - -c
        - |
          echo "Checking for sealed info in 'vault status' output"
          ATTEMPTS=10
          n=0
          until [ "$n" -ge $ATTEMPTS ]
          do
            echo "Attempt" $n...
            vault status -format yaml | grep -E '^sealed: (true|false)' && break
            n=$((n+1))
            sleep 5
          done
          if [ $n -ge $ATTEMPTS ]; then
            echo "timed out looking for sealed info in 'vault status' output"
            exit 1
          fi

          exit 0
      env:
        - name: VAULT_ADDR
          value: http://vault.vault.svc:8200
      image: hashicorp/vault:2.2.2
      imagePullPolicy: IfNotPresent
      name: vault-server-test
      volumeMounts:
        - mountPath: /home/vault/.oci
          name: oci
          readOnly: true
  restartPolicy: Never
  volumes:
    - name: oci
      secret:
        defaultMode: 256
        secretName: vault-oci
