apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: speedtest-exporter
    app.kubernetes.io/version: v3.2.2
    helm.sh/chart: speedtest-exporter-5.4.2
  name: speedtest-exporter
spec:
  ports:
    - name: metrics
      port: 9798
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/name: speedtest-exporter
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: speedtest-exporter
    app.kubernetes.io/version: v3.2.2
    helm.sh/chart: speedtest-exporter-5.4.2
  name: speedtest-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: speedtest-exporter
      app.kubernetes.io/name: speedtest-exporter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: speedtest-exporter
        app.kubernetes.io/name: speedtest-exporter
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: TZ
              value: Europe/Budapest
          image: ghcr.io/miguelndecarvalho/speedtest-exporter:v3.5.4
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9798
            timeoutSeconds: 1
          name: speedtest-exporter
          ports:
            - containerPort: 9798
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9798
            timeoutSeconds: 1
          securityContext:
            runAsUser: 1000
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 9798
            timeoutSeconds: 1
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      serviceAccountName: default
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: speedtest-exporter
    app.kubernetes.io/version: v3.2.2
    helm.sh/chart: speedtest-exporter-5.4.2
  name: speedtest-exporter
spec:
  groups:
    - name: speedtest-exporter
      rules:
        - alert: SpeedtestExporterAbsent
          annotations:
            description: Speedtest Exporter has disappeared from Prometheus target discovery.
            summary: Speedtest Exporter is down.
          expr: |
            absent(up{job=~".*speedtest-exporter.*"} == 1)
          for: 30m
          labels:
            severity: critical
        - alert: SpeedtestSlowInternetDownload
          annotations:
            description: Internet download speed is averaging {{ humanize $value }} Mbps.
            summary: SpeedTest slow internet download.
          expr: |
            avg_over_time(speedtest_download_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 2e+08
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestSlowInternetUpload
          annotations:
            description: Internet upload speed is averaging {{ humanize $value }} Mbps.
            summary: SpeedTest slow internet upload.
          expr: |
            avg_over_time(speedtest_upload_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 1e+07
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighPingLatency
          annotations:
            description: Internet ping latency is averaging {{ humanize $value }} ms.
            summary: SpeedTest high ping latency.
          expr: |
            avg_over_time(speedtest_ping_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 10
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighJitterLatency
          annotations:
            description: Internet jitter latency is averaging {{ humanize $value }} ms.
            summary: SpeedTest high jitter latency.
          expr: |
            avg_over_time(speedtest_jitter_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 30
          for: 0m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: speedtest-exporter
    app.kubernetes.io/version: v3.2.2
    helm.sh/chart: speedtest-exporter-5.4.2
  name: speedtest-exporter
spec:
  endpoints:
    - interval: 15m
      path: /metrics
      port: metrics
      scrapeTimeout: 1m
  selector:
    matchLabels:
      app.kubernetes.io/instance: speedtest-exporter
      app.kubernetes.io/name: speedtest-exporter
