metadata:
  labels:
    app: openebs-monitoring-jiva
    app.kubernetes.io/instance: openebs-monitoring
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openebs-monitoring
    app.kubernetes.io/version: 2.12.0
    helm.sh/chart: openebs-monitoring-0.4.13
    release: openebs-monitoring
  name: openebs-monitoring-jiva
  namespace: openebs
spec:
  endpoints:
    - path: /metrics
      port: exporter
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_vsm
          targetLabel: openebs_pv
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_openebs_io_persistent_volume
          targetLabel: openebs_pv
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_openebs_io_persistent_volume_claim
          targetLabel: openebs_pvc
        - action: replace
          sourceLabels:
            - __meta_kubernetes_endpoints_label_openebs_io_cas_type
          targetLabel: openebs_cas_type
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      openebs.io/cas-type: jiva
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: openebs-monitoring-lvmLocalPV
    app.kubernetes.io/instance: openebs-monitoring
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openebs-monitoring
    app.kubernetes.io/version: 2.12.0
    helm.sh/chart: openebs-monitoring-0.4.13
    release: openebs-monitoring
  name: openebs-monitoring-lvmlocalpv
  namespace: openebs
spec:
  endpoints:
    - path: /metrics
      port: metrics
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      name: openebs-lvm-node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: openebs-monitoring-ndm
    app.kubernetes.io/instance: openebs-monitoring
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openebs-monitoring
    app.kubernetes.io/version: 2.12.0
    helm.sh/chart: openebs-monitoring-0.4.13
    release: openebs-monitoring
  name: openebs-monitoring-ndm
  namespace: openebs
spec:
  endpoints:
    - path: /metrics
      port: metrics
  namespaceSelector:
