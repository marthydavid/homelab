apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ipmi-secret
spec:
  data:
    - remoteRef:
        key: secret/cert-manager-pecs
        property: aws_ak
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: secret/cert-manager-pecs
        property: aws_sk
      secretKey: AWS_SECRET_ACCESS_KEY
    - remoteRef:
        key: secret/general
        property: IPMI_PASSWORD
      secretKey: IPMI_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ipmi-secret
