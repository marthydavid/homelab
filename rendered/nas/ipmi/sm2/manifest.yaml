apiVersion: v1
data:
  AWS_DEFAULT_REGION: eu-central-1
  IPMI_DOMAIN: sm2.ipmi.marthy.xyz
  IPMI_USERNAME: ADMIN
  LE_EMAIL: marthy.david+ipmi@gmail.com
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: sm2-ipmi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sm2-ipmi
    helm.sh/chart: app-template-1.5.1
  name: sm2-ipmi-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: sm2-ipmi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sm2-ipmi
    helm.sh/chart: app-template-1.5.1
  name: sm2-ipmi
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          annotations:
            checksum/config: e6431f7070c318001432dc21dd4231ca27f1d68c4aad3b29363c0e84960f6401
          labels:
            app.kubernetes.io/instance: sm2-ipmi
            app.kubernetes.io/name: sm2-ipmi
        spec:
          automountServiceAccountToken: true
          containers:
            - envFrom:
                - configMapRef:
                    name: sm2-ipmi-config
                - secretRef:
                    name: ipmi-secret
              image: ghcr.io/marthydavid/supermicro-letsencrypt:v0.4.1
              imagePullPolicy: IfNotPresent
              name: sm2-ipmi
              securityContext:
                runAsUser: 1000
              volumeMounts:
                - mountPath: /home/lego/.lego
                  name: lego
          dnsPolicy: ClusterFirst
          enableServiceLinks: true
          restartPolicy: Never
          serviceAccountName: default
          volumes:
            - hostPath:
                path: /zfs/k3s/configs/sm-lego
              name: lego
  schedule: 10 */2 * * *
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
