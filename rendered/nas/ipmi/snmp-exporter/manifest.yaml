    release: rancher-monitoring
  name: prometheus-snmp-exporter-budapest-mikrotik
  namespace: cattle-monitoring-system
spec:
  endpoints:
    - honorLabels: true
      metricRelabelings:
        - action: replace
          replacement: 192.168.1.1
          sourceLabels:
            - instance
          targetLabel: instance
        - action: replace
          replacement: budapest-mikrotik
          sourceLabels:
            - target
          targetLabel: target
      params:
        auth:
          - public_v2
        module:
          - if_mib
        target:
          - 192.168.1.1
      path: /snmp
      port: http
      scrapeTimeout: 10s
  jobLabel: prometheus-snmp-exporter
  selector:
    matchLabels:
      app.kubernetes.io/instance: prometheus-snmp-exporter
      app.kubernetes.io/name: prometheus-snmp-exporter
