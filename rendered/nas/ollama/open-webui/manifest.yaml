apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: open-webui
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/version: 0.13.5
    helm.sh/chart: open-webui-18.5.0
  name: open-webui
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: open-webui
      app.kubernetes.io/instance: open-webui
  serviceName: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: open-webui
        app.kubernetes.io/instance: open-webui
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/version: 0.13.5
        helm.sh/chart: open-webui-18.5.0
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: WEBUI_URL
              value: https://openwebui.pecs.marthy.xyz
            - name: OLLAMA_BASE_URLS
              value: http://open-webui-ollama.ollama.svc.cluster.local:11434
            - name: OPENAI_API_BASE_URLS
              value: http://open-webui-pipelines.ollama.svc.cluster.local:9099;https://api.openai.com/v1
            - name: ENABLE_WEBSOCKET_SUPPORT
              value: "True"
            - name: WEBSOCKET_MANAGER
              value: redis
            - name: REDIS_URL
              value: redis://open-webui-redis.ollama.svc.cluster.local:6379/0
            - name: WEBSOCKET_REDIS_URL
              value: redis://open-webui-redis.ollama.svc.cluster.local:6379/0
            - name: OPENAI_API_KEY
              value: 0p3n-w3bu!
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: "True"
          image: ghcr.io/open-webui/open-webui:0.13.5
          imagePullPolicy: IfNotPresent
          name: open-webui
          ports:
            - containerPort: 8080
              name: http
          tty: true
          volumeMounts:
            - mountPath: /app/backend/data
              name: data
      enableServiceLinks: false
      initContainers:
        - command:
            - sh
            - -c
            - cp -R -n /app/backend/data/* /tmp/app-data/
          image: ghcr.io/open-webui/open-webui:0.13.5
          imagePullPolicy: IfNotPresent
          name: copy-app-data
          volumeMounts:
            - mountPath: /tmp/app-data
              name: data
      serviceAccountName: open-webui-sa
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/alias: "true"
    external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
  labels:
    app.kubernetes.io/component: open-webui
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/version: 0.13.5
    helm.sh/chart: open-webui-18.5.0
  name: open-webui
  namespace: ollama
spec:
  ingressClassName: nginx
  rules:
    - host: openwebui.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: open-webui
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - openwebui.pecs.marthy.xyz
      secretName: open-webui-tls
---
