apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: open-webui-ollama
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ollama
    app.kubernetes.io/version: 0.33.2
    helm.sh/chart: ollama-1.79.0
  name: open-webui-ollama
  namespace: ollama
spec:
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: open-webui-ollama
      app.kubernetes.io/instance: open-webui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: open-webui-ollama
        app.kubernetes.io/instance: open-webui
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: ollama
        app.kubernetes.io/version: 0.33.2
        helm.sh/chart: ollama-1.79.0
    spec:
      containers:
        - args: null
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: PATH
              value: /usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom: null
          image: ollama/ollama:0.33.2
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while ! /bin/ollama ps > /dev/null 2>&1; do
                      sleep 5
                    done

                    /bin/ollama pull  codegemma:2b

                    /bin/ollama pull  codegemma:7b

                    /bin/ollama pull  codellama:7b

                    /bin/ollama pull  deepseek-coder:6.7b
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          name: ollama
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              nvidia.com/gpu: 1
            requests: {}
          securityContext: {}
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
      runtimeClassName: nvidia
      securityContext: {}
      serviceAccountName: open-webui-ollama
      terminationGracePeriodSeconds: 120
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: open-webui-ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: pipelines
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pipelines
    app.kubernetes.io/version: alpha
    helm.sh/chart: pipelines-0.12.2
  name: open-webui-pipelines
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: pipelines
      app.kubernetes.io/instance: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pipelines
        app.kubernetes.io/instance: open-webui
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: pipelines
        app.kubernetes.io/version: alpha
        helm.sh/chart: pipelines-0.12.2
    spec:
      automountServiceAccountToken: false
      containers:
        - env: null
          image: ghcr.io/open-webui/pipelines:main
          imagePullPolicy: Always
          name: pipelines
          ports:
            - containerPort: 9099
              name: http
          tty: true
          volumeMounts:
            - mountPath: /app/pipelines
              name: data
      enableServiceLinks: false
      serviceAccountName: open-webui-pipelines
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-pipelines
