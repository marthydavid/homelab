apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    app.kubernetes.io/service: radarr
    helm.sh/chart: app-template-1.5.1
  name: radarr
spec:
  ports:
    - name: http
      port: 7878
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/name: radarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    helm.sh/chart: app-template-1.5.1
  name: radarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: radarr
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: RADARR__API_KEY
              valueFrom:
                secretKeyRef:
                  key: api_key
                  name: radarr-secret
            - name: RADARR__APPLICATION_URL
              value: https://radarr.pecs.marthy.xyz
            - name: RADARR__INSTANCE_NAME
              value: Radarr
            - name: RADARR__LOG_LEVEL
              value: info
            - name: RADARR__PORT
              value: "7878"
          image: ghcr.io/home-operations/radarr:7.0.2.10888
          imagePullPolicy: null
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 7878
            timeoutSeconds: 1
          name: radarr
          ports:
            - containerPort: 7878
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 7878
            timeoutSeconds: 1
          resources:
            limits:
              memory: 431M
            requests:
              cpu: 5m
              memory: 431M
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 7878
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /zfs/media
              name: media
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
        supplementalGroups:
          - 65539
      serviceAccountName: default
      volumes:
        - hostPath:
            path: /zfs/k3s/configs/radarr-config
          name: config
        - hostPath:
            path: /zfs/media
          name: media
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/alias: "true"
    external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    helm.sh/chart: app-template-1.5.1
  name: radarr
spec:
  ingressClassName: nginx
  rules:
    - host: radarr.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: radarr
                port:
                  number: 7878
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - radarr.pecs.marthy.xyz
      secretName: radarr-tls
