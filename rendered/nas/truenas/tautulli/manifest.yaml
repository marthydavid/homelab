apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: tautulli
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tautulli
    helm.sh/chart: app-template-5.3.0
  name: tautulli
  namespace: mediarr
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: tautulli
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/service: tautulli
    helm.sh/chart: app-template-5.3.0
  name: tautulli
  namespace: mediarr
spec:
  ports:
    - name: http
      port: 8181
      protocol: TCP
      targetPort: 8181
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: tautulli
    app.kubernetes.io/name: tautulli
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: tautulli
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tautulli
    helm.sh/chart: app-template-5.3.0
  name: tautulli
  namespace: mediarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: tautulli
      app.kubernetes.io/name: tautulli
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: tautulli
        app.kubernetes.io/name: tautulli
    spec:
      automountServiceAccountToken: false
      containers:
        - image: ghcr.io/home-operations/tautulli:2.19.1
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8181
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8181
            timeoutSeconds: 1
          resources:
            limits:
              memory: 323M
            requests:
              cpu: 5m
              memory: 323M
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 8181
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
        supplementalGroups:
          - 65539
      serviceAccountName: tautulli
      volumes:
        - hostPath:
            path: /zfs/k3s/configs/tautulli-config
          name: config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/alias: "true"
    external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
  labels:
    app.kubernetes.io/instance: tautulli
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tautulli
    helm.sh/chart: app-template-5.3.0
  name: tautulli
  namespace: mediarr
spec:
  ingressClassName: nginx
  rules:
    - host: tautulli.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: tautulli
                port:
                  number: 8181
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - tautulli.pecs.marthy.xyz
      secretName: tautulli-tls
