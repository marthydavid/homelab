apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: plex
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: plex
    helm.sh/chart: app-template-5.3.0
  name: plex
  namespace: mediarr
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: plex
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: plex
    app.kubernetes.io/service: plex
    helm.sh/chart: app-template-5.3.0
  name: plex
  namespace: mediarr
spec:
  ports:
    - name: http
      port: 32400
      protocol: TCP
      targetPort: 32400
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: plex
    app.kubernetes.io/name: plex
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: plex
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: plex
    helm.sh/chart: app-template-5.3.0
  name: plex
  namespace: mediarr
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: plex
      app.kubernetes.io/name: plex
  serviceName: plex
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: main
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: plex
        app.kubernetes.io/name: plex
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PLEX_URL
              value: http://localhost:32400
            - name: REFRESH_LIBRARY_ON_SCAN
              value: "false"
            - name: TZ
              value: Europe/Budapest
          envFrom:
            - secretRef:
                name: plex-token
          image: docker.io/remirigal/plex-auto-languages:v1.2.3
          imagePullPolicy: IfNotPresent
          name: auto-languages
          volumeMounts:
            - mountPath: /.local
              name: local
            - mountPath: /config
              name: pal-config
        - env:
            - name: TZ
              value: Europe/Budapest
          image: ghcr.io/home-operations/plex:rolling@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 32400
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 32400
            timeoutSeconds: 1
          resources:
            limits:
              memory: 10000Mi
              nvidia.com/gpu: 1
            requests:
              cpu: 100m
              memory: 2000Mi
              nvidia.com/gpu: 1
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 32400
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /.local
              name: local
            - mountPath: /zfs/media
              name: media
            - mountPath: /pal-config
              name: pal-config
            - mountPath: /transcode
              name: transcode
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: true
      hostPID: false
      nodeSelector:
        nvidia.com/gpu.count: "1"
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
        supplementalGroups:
          - 44
          - 109
          - 10000
      serviceAccountName: plex
      volumes:
        - hostPath:
            path: /zfs/k3s/configs/plex-config
          name: config
        - emptyDir: {}
          name: local
        - hostPath:
            path: /zfs/media
          name: media
        - hostPath:
            path: /zfs/k3s/configs/plex-auto-languages-config
          name: pal-config
        - emptyDir: {}
          name: transcode
  updateStrategy:
    type: RollingUpdate
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  labels:
    app.kubernetes.io/instance: plex
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: plex
    helm.sh/chart: app-template-5.3.0
  name: plex
  namespace: mediarr
spec:
  ingressClassName: nginx
  rules:
    - host: plex.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: plex
                port:
                  number: 32400
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - plex.pecs.marthy.xyz
      secretName: plex-tls
