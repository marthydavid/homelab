apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
    helm.sh/chart: app-template-5.3.0
  name: qbittorrent
  namespace: mediarr
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/service: qbittorrent
    helm.sh/chart: app-template-5.3.0
  name: qbittorrent
  namespace: mediarr
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/name: qbittorrent
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
    helm.sh/chart: app-template-5.3.0
  name: qbittorrent
  namespace: mediarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: qbittorrent
      app.kubernetes.io/name: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: QBT_WEBUI_PORT
              value: "8080"
          image: ghcr.io/home-operations/qbittorrent:5.3.0
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 100m
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config/.cache
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /zfs/media
              name: media
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      hostname: qbittorrent
      initContainers:
        - command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              dst=/config/qBittorrent
              if [ -f "$dst/.migrated-from-v4" ]; then echo "already migrated"; exit 0; fi
              if [ -e "$dst/qBittorrent.conf" ]; then echo "refusing: $dst already has a config"; exit 1; fi
              mkdir -p "$dst"
              cp -a /v4/data/. "$dst/"
              cp -a /v4/config/. "$dst/"
              rm -rf "$dst/.cache" "$dst/ipc-socket" "$dst/lockfile" "$dst/rss/storage.lock"
              sed -i 's#^FileLogger\\Path=.*#FileLogger\\Path=/config/qBittorrent/logs#' "$dst/qBittorrent.conf"
              touch "$dst/.migrated-from-v4"
              echo "migrated, BT_backup files: $(ls "$dst/BT_backup" | wc -l)"
          image: ghcr.io/home-operations/qbittorrent:5.3.0
          name: migrate-v4
          volumeMounts:
            - mountPath: /config/.cache
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /zfs/media
              name: media
            - mountPath: /v4/config
              name: v4-config
              readOnly: true
            - mountPath: /v4/data
              name: v4-data
              readOnly: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
        supplementalGroups:
          - 10000
      serviceAccountName: qbittorrent
      volumes:
        - emptyDir: {}
          name: cache
        - hostPath:
            path: /zfs/k3s/configs/qbittorrent-v5
          name: config
        - hostPath:
            path: /zfs/media
          name: media
        - hostPath:
            path: /zfs/k3s/configs/qbittorrent-config
          name: v4-config
        - hostPath:
            path: /zfs/k3s/configs/qbittorrent-data
          name: v4-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/alias: "true"
    external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
  labels:
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
    helm.sh/chart: app-template-5.3.0
  name: qbittorrent
  namespace: mediarr
spec:
  ingressClassName: nginx
  rules:
    - host: qbit.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - qbit.pecs.marthy.xyz
      secretName: qbit-tls
