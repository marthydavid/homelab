apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-token
spec:
  data:
    - remoteRef:
        key: secret/general
        property: PLEX_TOKEN
      secretKey: PLEX_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: plex-token
