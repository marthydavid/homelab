apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    helm.sh/chart: app-template-5.3.0
  name: sonarr
  namespace: mediarr
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/service: sonarr
    helm.sh/chart: app-template-5.3.0
  name: sonarr
  namespace: mediarr
spec:
  ports:
    - name: http
      port: 8989
      protocol: TCP
      targetPort: 8989
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/name: sonarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    helm.sh/chart: app-template-5.3.0
  name: sonarr
  namespace: mediarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: sonarr
      app.kubernetes.io/name: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: sonarr
        app.kubernetes.io/name: sonarr
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: SONARR__API_KEY
              valueFrom:
                secretKeyRef:
                  key: api_key
                  name: sonarr-secret
            - name: SONARR__APPLICATION_URL
              value: https://sonarr.pecs.marthy.xyz
            - name: SONARR__INSTANCE_NAME
              value: Sonarr
            - name: SONARR__LOG_LEVEL
              value: info
            - name: SONARR__PORT
              value: "8989"
          image: ghcr.io/home-operations/sonarr:5.0.0.2941
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8989
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8989
            timeoutSeconds: 1
          resources:
            limits:
              memory: 323M
            requests:
              cpu: 5m
              memory: 323M
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: 8989
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /zfs/media
              name: media
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
        supplementalGroups:
          - 65539
      serviceAccountName: sonarr
      volumes:
        - hostPath:
            path: /zfs/k3s/configs/sonarr-config
          name: config
        - hostPath:
            path: /zfs/media
          name: media
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/alias: "true"
    external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
  labels:
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    helm.sh/chart: app-template-5.3.0
  name: sonarr
  namespace: mediarr
spec:
  ingressClassName: nginx
  rules:
    - host: sonarr.pecs.marthy.xyz
      http:
        paths:
          - backend:
              service:
                name: sonarr
                port:
                  number: 8989
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - sonarr.pecs.marthy.xyz
      secretName: sonarr-tls
