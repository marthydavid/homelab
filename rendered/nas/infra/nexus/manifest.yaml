kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: repository
    app.kubernetes.io/instance: nexus3
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nexus3
    app.kubernetes.io/version: 3.97.0
    helm.sh/chart: nexus3-5.27.0
  name: nexus3-props
