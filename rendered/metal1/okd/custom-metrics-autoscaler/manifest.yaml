apiVersion: v1
kind: Namespace
metadata:
  labels:
    security.openshift.io/scc.podSecurityLabelSync: "true"
  name: openshift-keda
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: keda-installer
  namespace: openshift-keda
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: keda-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: keda-installer
    namespace: openshift-keda
---
apiVersion: keda.sh/v1alpha1
kind: KedaController
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: keda
  namespace: openshift-keda
spec:
  admissionWebhooks:
    logEncoder: console
    logLevel: info
    resources: {}
  metricsServer:
    auditConfig:
      lifetime: {}
      policy: {}
    logLevel: "0"
    resources: {}
  operator:
    logEncoder: console
    logLevel: info
    resources: {}
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: openshift-custom-metrics-autoscaler-operator
spec:
  namespace: openshift-keda
  serviceAccount:
    name: keda-installer
  source:
    catalog:
      channels:
        - stable
      packageName: openshift-custom-metrics-autoscaler-operator
      upgradeConstraintPolicy: CatalogProvided
      version: 2.19.0-4
    sourceType: Catalog
