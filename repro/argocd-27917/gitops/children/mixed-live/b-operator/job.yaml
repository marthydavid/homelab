# Applies cleanly (Live != nil) and finishes: the "healthy half" of the mixed child.
apiVersion: batch/v1
kind: Job
metadata:
  name: operator-install
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: install
          image: docker.io/library/busybox:1.37.0
          command: [sh, -c, 'echo "operator-install job ran at $(date -u +%FT%TZ)"']
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
