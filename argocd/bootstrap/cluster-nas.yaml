# The hub cluster itself. No credentials: ArgoCD uses its in-cluster service account.
# homelab/auto-sync is "false": review each diff and sync by hand. Flip it to "true" for automatic sync.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-nas
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    homelab/cluster: nas
    homelab/auto-sync: "false"
stringData:
  name: nas
  server: https://kubernetes.default.svc
