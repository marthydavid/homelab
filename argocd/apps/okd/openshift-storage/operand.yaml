# Captured from metal1 (OKD) on 2026-11-12; installed by hand before ArgoCD managed it.
# Operand: applied after the operator's CRDs exist (wave 2, SkipDryRunOnMissingResource).
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: test-lvmcluster
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  storage:
    deviceClasses:
      - deviceSelector:
          paths:
            - /dev/sda
        fstype: xfs
        name: vg1
        thinPoolConfig:
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
          name: thin-pool-1
          overprovisionRatio: 10
          sizePercent: 90
