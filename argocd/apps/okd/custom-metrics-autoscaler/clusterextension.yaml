# OLM v1 pilot (2026-11-12): KEDA moves from OLM (Classic) Subscription/OperatorGroup to a
# ClusterExtension. Pinned to the exact version that was installed by OLM (Classic), so the move
# itself changes nothing; Renovate bumps spec.source.catalog.version to upgrade. (Renovate test:
# pinned one release back on purpose, so Renovate proposes 2.19.0-4.)
# OKD 4.22 still requires an installer ServiceAccount (deprecated and ignored from 5.0, where
# OLM v1 uses its own cluster-admin account), so it gets cluster-admin here as well.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-installer
  namespace: openshift-keda
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-installer
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: keda-installer
    namespace: openshift-keda
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  # Short on purpose: OLM v1 (4.22) stores the install as Secret sh.helm.release.v1.<name>.v1 and
  # the name ends up in a label (max 63 bytes), so <name> must stay under ~40 characters.
  name: keda
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespace: openshift-keda
  serviceAccount:
    name: keda-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: openshift-custom-metrics-autoscaler-operator
      channels:
        - stable
      # renovate: datasource=custom.okd-operators depName=openshift-custom-metrics-autoscaler-operator
      version: "2.19.0-3"
      upgradeConstraintPolicy: CatalogProvided
