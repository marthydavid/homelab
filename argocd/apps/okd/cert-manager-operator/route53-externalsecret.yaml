# Route53 key for the letsencrypt-prod ClusterIssuer (DNS-01), from Vault secret/cert-manager-pecs
# (the same key nas uses), via metal1's vault-backend ClusterSecretStore (okd/external-secrets-operator).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-awssecret
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: route53-awssecret
    creationPolicy: Owner
  data:
  - secretKey: aws_ak
    remoteRef:
      key: secret/cert-manager-pecs
      property: aws_ak
  - secretKey: aws_sk
    remoteRef:
      key: secret/cert-manager-pecs
      property: aws_sk
