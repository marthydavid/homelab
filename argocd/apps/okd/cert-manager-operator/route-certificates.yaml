# Captured from metal1 on 2026-11-12. The secrets are used by the default IngressController
# (cert-manager-routes) and the console route (console-routes).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-routes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: openshift-ingress
spec:
  commonName: apps.metal1.okd.marthy.xyz
  dnsNames:
    - apps.metal1.okd.marthy.xyz
    - "*.apps.metal1.okd.marthy.xyz"
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: cert-manager-routes
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-routes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: openshift-config
spec:
  commonName: console.apps.metal1.okd.marthy.xyz
  dnsNames:
    - console.apps.metal1.okd.marthy.xyz
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: console-routes
