# Captured from metal1 on 2026-11-12. The Route53 Secret route53-awssecret (namespace
# cert-manager) is still hand-made; it moves to an ExternalSecret from Vault
# secret/cert-manager-pecs once metal1's ESO can log in to Vault (branch feat/metal1-eso-vault).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  acme:
    email: marthy.david@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        route53:
          region: eu-west-1
          accessKeyIDSecretRef:
            key: aws_ak
            name: route53-awssecret
          secretAccessKeySecretRef:
            key: aws_sk
            name: route53-awssecret
