# Identity metal1's ESO uses to log in to Vault (vault.marthy.xyz) with Kubernetes auth at
# auth/kubernetes-metal1, role external-secrets. Vault checks the token with a TokenReview
# on metal1, so this ServiceAccount needs system:auth-delegator. No secret to bootstrap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: external-secrets-operator
