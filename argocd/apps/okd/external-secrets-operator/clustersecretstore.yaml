# Same name as on nas (vault-backend), so shared manifests (e.g. cert-manager-config) work on both.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    vault:
      server: https://vault.marthy.xyz
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-metal1
          role: external-secrets
          serviceAccountRef:
            name: vault-auth
            namespace: external-secrets-operator
            audiences:
              - vault
