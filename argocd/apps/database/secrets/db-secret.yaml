apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: cloudnative-pg-secret
  namespace: database
spec:
  target:
    name: cloudnative-pg-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - secretKey: username
      remoteRef:
        key: secret/general
        property: DB_USERNAME
    - secretKey: password
      remoteRef:
        key: secret/general
        property: DB_PASSWORD
