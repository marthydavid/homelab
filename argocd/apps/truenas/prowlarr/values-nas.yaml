controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/prowlarr
          tag: 2.7.0.5723
        env:
          PROWLARR__INSTANCE_NAME: prowlarr
          PROWLARR__PORT: 9696
          PROWLARR__APPLICATION_URL: "https://prowlarr.pecs.marthy.xyz"
          PROWLARR__LOG_LEVEL: info
          PROWLARR__API_KEY:
            valueFrom:
              secretKeyRef:
                name: prowlarr-secret
                key: api_key
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9696
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9696
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
        resources:
          requests:
            cpu: 5m
            memory: 323M
          limits:
            memory: 323M

defaultPodOptions:
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
    supplementalGroups:
      - 65539

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

ingress:
  main:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "prowlarr.pecs.marthy.xyz"
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - prowlarr.pecs.marthy.xyz
        secretName: prowlarr-tls

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/prowlarr-config
    globalMounts:
      - path: /config
