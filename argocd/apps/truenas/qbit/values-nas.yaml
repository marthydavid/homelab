controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      # One-off move from the v4 profile layout (two hostPaths) to the v5 layout
      # (everything in /config/qBittorrent). Runs after the v4 pod has stopped
      # (Recreate), skips itself once done. Remove together with the v4 mounts
      # once v5 has run for a while (#2015).
      migrate-v4:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0
        command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            dst=/config/qBittorrent
            if [ -f "$dst/.migrated-from-v4" ]; then echo "already migrated"; exit 0; fi
            if [ -e "$dst/qBittorrent.conf" ]; then echo "refusing: $dst already has a config"; exit 1; fi
            mkdir -p "$dst"
            cp -a /v4/data/. "$dst/"
            cp -a /v4/config/. "$dst/"
            rm -rf "$dst/.cache" "$dst/ipc-socket" "$dst/lockfile" "$dst/rss/storage.lock"
            sed -i 's#^FileLogger\\Path=.*#FileLogger\\Path=/config/qBittorrent/logs#' "$dst/qBittorrent.conf"
            touch "$dst/.migrated-from-v4"
            echo "migrated, BT_backup files: $(ls "$dst/BT_backup" | wc -l)"
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0
        env:
          QBT_WEBUI_PORT: "8080"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi

defaultPodOptions:
  hostname: qbittorrent
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
    supplementalGroups:
      - 10000

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: "nginx"
    annotations:
      external-dns.alpha.kubernetes.io/alias: "true"
      external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "qbit.pecs.marthy.xyz"
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - qbit.pecs.marthy.xyz
        secretName: qbit-tls

persistence:
  # v5 layout: config and data both live in /config/qBittorrent (XDG dirs under /config)
  config:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/qbittorrent-v5
    globalMounts:
      - path: /config
  cache:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /config/.cache
  media:
    enabled: true
    type: hostPath
    hostPath: /zfs/media
    globalMounts:
      - path: /zfs/media
  # v4 directories, read-only and only for the migrate-v4 init container
  v4-config:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/qbittorrent-config
    advancedMounts:
      main:
        migrate-v4:
          - path: /v4/config
            readOnly: true
  v4-data:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/qbittorrent-data
    advancedMounts:
      main:
        migrate-v4:
          - path: /v4/data
            readOnly: true
