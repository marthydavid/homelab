controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0
        env:
          QBT_WEBUI_PORT: "8080"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi

defaultPodOptions:
  hostname: qbittorrent
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: "OnRootMismatch"
    supplementalGroups:
      - 10000

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: "nginx"
    annotations:
      external-dns.alpha.kubernetes.io/alias: "true"
      external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "qbit.pecs.marthy.xyz"
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - qbit.pecs.marthy.xyz
        secretName: qbit-tls

persistence:
  # v5 layout: config and data both live in /config/qBittorrent (XDG dirs under /config)
  config:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/qbittorrent-v5
    globalMounts:
      - path: /config
  cache:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /config/.cache
  media:
    enabled: true
    type: hostPath
    hostPath: /zfs/media
    globalMounts:
      - path: /zfs/media
