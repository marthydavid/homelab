# chart 0.12: bjw-s common layout, external Postgres (CNPG cluster immich-postgres from immich-postgres/), valkey instead of redis
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.3.5
        env:
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: host
          DB_PORT:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: port
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: dbname
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: user
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: password

valkey:
  enabled: true

immich:
  persistence:
    library:
      existingClaim: immich

server:
  enabled: true
  controllers:
    main:
      pod:
        runtimeClassName: nvidia
      containers:
        main:
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
  ingress:
    main:
      enabled: true
      annotations:
        # proxy-body-size is set to 0 to remove the body limit on file uploads
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
        external-dns.alpha.kubernetes.io/alias: "true"
      hosts:
        - host: immich.marthy.xyz
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - hosts:
            - immich.marthy.xyz
          secretName: immich-tls

machine-learning:
  enabled: true
  controllers:
    main:
      pod:
        runtimeClassName: nvidia
      containers:
        main:
          image:
            tag: v3.3.5-cuda
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
