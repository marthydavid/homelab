# One-time seed of Vault secret/nexus (property admin-password) from the Secret nexus3-root.
# Not rendered by the overlay (apply by hand, see nexus-push-policy.hcl for the Vault side).
#
# updatePolicy IfNotExists: never overwrites an existing Vault value.
# deletionPolicy None: deleting this PushSecret never deletes anything in Vault.
#
# Order: 1) apply nexus-push-policy.hcl in Vault and attach it to the external-secrets AppRole,
#        2) apply this PushSecret and wait for Ready=True,
#        3) delete this PushSecret and the hand-made Secret nexus3-root,
#        4) add nexus-root-externalsecret.yaml to the overlay (it recreates nexus3-root from Vault).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: nexus3-root-seed
  namespace: nexus
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: nexus3-root
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: nexus
          property: admin-password
