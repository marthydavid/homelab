# Nexus admin password (consumed by the nexus3 Helm release via rootPassword.secret).
# Vault: secret/nexus, property admin-password (seeded once through the PushSecret in
# nexus-root-pushsecret.yaml, see nexus-push-policy.hcl for the Vault side). Rendered by the overlay.
# Rotating the value in Vault updates the Secret but NOT the running Nexus: the password is only applied
# on first init of /nexus-data, so change it in Nexus as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: nexus3-root
  namespace: nexus
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nexus3-root
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/nexus
        property: admin-password
