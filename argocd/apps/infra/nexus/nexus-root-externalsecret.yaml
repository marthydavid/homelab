# Nexus admin password (consumed by the nexus3 Helm release via rootPassword.secret).
# Vault: secret/nexus, property admin-password. The store's AppRole is read-only, so seed the value
# once with an authenticated Vault client (see nexus/values.yaml). Not applied to the cluster yet: the
# live Secret nexus3-root was created by hand from ~/.config/nexus/admin-password. Delete it before
# adopting this ExternalSecret (creationPolicy: Owner).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: nexus3-root
  namespace: nexus
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nexus3-root
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/nexus
        property: admin-password
