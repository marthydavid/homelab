global:
  # argo-cd chart >=6 derives the ingress host (and argocd-cm url) from this
  domain: argocd.marthy.xyz

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  # Custom rules REPLACE the chart's defaults, so these are the argo-cd 10.12.0 defaults
  # plus pods/exec (needed by the web terminal, configs.cm exec.enabled).
  clusterRoleRules:
    enabled: true
    rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: [delete, get, patch]
      - apiGroups: [""]
        resources: [events]
        verbs: [list, create]
      - apiGroups: [""]
        resources: [pods, pods/log]
        verbs: [get]
      - apiGroups: [""]
        resources: [pods/exec]
        verbs: [create]
      - apiGroups: [argoproj.io]
        resources: [applications, applicationsets]
        verbs: [get, list, update, watch]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [create]
      - apiGroups: [argoproj.io]
        resources: [workflows]
        verbs: [create]
  autoscaling:
    enabled: false
    minReplicas: 1
  ingress:
    # -- Enable an ingress resource for the Argo CD server
    enabled: true
    # TLS secret argocd-server-tls, issued by cert-manager
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # No external-dns target: like headlamp/litellm, the record points at the
    # ingress LB (192.168.20.1). The WAN proxy behind pecs.marthy.xyz only knows *.pecs names.
    ingressClassName: "nginx"

repoServer:
  autoscaling:
    enabled: false
    minReplicas: 1

applicationSet:
  replicaCount: 1


# Source Hydrator: renders manifests from the dry source and pushes them to the `rendered` branch.
# See docs/source-hydrator.md. Nothing uses it until an Application sets spec.sourceHydrator.
commitServer:
  enabled: true

configs:
  cm:
    create: true
    url: "https://argocd.marthy.xyz"
    # Web-based terminal in the pod view. The built-in role:admin already has `exec, create`;
    # the argocd-server ClusterRole gets pods/exec via server.clusterRoleRules above.
    exec.enabled: "true"
    # Lets kustomize inflate Helm charts (helmCharts:), which is how multi-source Helm apps get
    # wrapped into a single source for the Source Hydrator (docs/source-hydrator.md).
    kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
  params:
    # Diff against a server-side apply dry-run, so fields the API server / CRDs default
    # (ExternalSecret remoteRef policies, ServiceMonitor relabeling action, ...) are not
    # reported as OutOfSync.
    controller.diff.server.side: true
    hydrator.enabled: true
