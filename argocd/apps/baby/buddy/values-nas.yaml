controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/linuxserver/babybuddy
          tag: 2.11.0
        env:
          PUID: 1000
          PGID: 1000
          TZ: Europe/Budapest
          LOG_LEVEL: "info"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
        resources:
          requests:
            cpu: 50m
            memory: 323M
          limits:
            memory: 323M

service:
  main:
    controller: main
    ports:
      http:
        port: 8000

ingress:
  main:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/target: pecs.marthy.xyz
      external-dns.alpha.kubernetes.io/alias: "true"
    hosts:
      - host: "baby.pecs.marthy.xyz"
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - baby.pecs.marthy.xyz
        secretName: baby-tls

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/babybuddy-config
    globalMounts:
      - path: /config
