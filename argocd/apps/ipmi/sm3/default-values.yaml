controllers:
  main:
    type: cronjob
    cronjob:
      # Forbid overlapping runs
      concurrencyPolicy: Forbid
      schedule: "10 */2 * * *"
      startingDeadlineSeconds: 30
      failedJobsHistory: 1
      successfulJobsHistory: 1
      backoffLimit: 6
    pod:
      restartPolicy: Never
    containers:
      main:
        image:
          repository: ghcr.io/marthydavid/supermicro-letsencrypt
          tag: v0.4.1
          pullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000

persistence:
  lego:
    enabled: true
    type: hostPath
    hostPath: /zfs/k3s/configs/sm-lego
    globalMounts:
      - path: /home/lego/.lego
