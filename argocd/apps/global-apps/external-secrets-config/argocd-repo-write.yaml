# Credentials ArgoCD uses to push hydrated manifests to the `rendered` branch (Source Hydrator,
# see docs/source-hydrator.md). Only the GitHub App values come from Vault (secret/argocd);
# url and type are fixed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: argocd-repo-write
  namespace: argocd
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-repo-write
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository-write
      data:
        type: git
        url: https://github.com/marthydavid/homelab
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppID
      remoteRef:
        key: secret/argocd
        property: githubAppID
    - secretKey: githubAppInstallationID
      remoteRef:
        key: secret/argocd
        property: githubAppInstallationID
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: secret/argocd
        property: githubAppPrivateKey
