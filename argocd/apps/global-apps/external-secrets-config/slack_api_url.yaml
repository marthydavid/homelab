apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: slack-api
  namespace: cattle-monitoring-system
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - secretKey: slack_api_url
      remoteRef:
        key: secret/general
        property: SM4_SLACK_API_URL

