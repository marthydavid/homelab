apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: clusterissuersecret_patch.yaml
    target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: route53-awssecret
    options:
      allowNameChange: true
