# metal1 (OKD): cert-manager comes from the openshift-cert-manager-operator (argocd/apps/okd).
# Same Route53 key as nas (Vault secret/cert-manager-pecs), plus the route certificates for the
# default ingress (*.apps) and the console.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - route-certificates.yaml
patches:
  - path: clusterissuersecret_patch.yaml
    target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: route53-awssecret
    options:
      allowNameChange: true
