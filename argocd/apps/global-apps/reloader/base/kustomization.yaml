# Helm chart inflated by kustomize so the Source Hydrator (single source) can render it.
# The chart version lives here now (Renovate's kustomize manager tracks helmCharts).
helmCharts:
- name: reloader
  repo: https://stakater.github.io/stakater-charts
  version: 2.2.19
  releaseName: reloader
  namespace: reloader-system
  includeCRDs: true
  valuesFile: values.yaml
