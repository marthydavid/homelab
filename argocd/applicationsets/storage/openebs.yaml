# Migrated from fleet/storage/00-openebs
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage-openebs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
          - metal1
  template:
    metadata:
      name: storage-openebs-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://openebs.github.io/charts
        chart: openebs
        targetRevision: 3.10.0
        helm:
          releaseName: openebs
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/storage/openebs/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: openebs
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
