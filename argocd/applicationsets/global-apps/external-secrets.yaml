# Migrated from former Fleet bundle global-apps/external-secrets
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: external-secrets-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.15.0
        helm:
          releaseName: external-secrets
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/global-apps/external-secrets/global-values.yaml
          - $values/argocd/apps/global-apps/external-secrets/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      # ClusterSecretStore etc. in sync-waves after the chart is healthy (was external-secrets-config)
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        path: argocd/apps/global-apps/external-secrets-config
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
