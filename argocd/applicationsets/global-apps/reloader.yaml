# Migrated from former Fleet bundle global-apps/reloader
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: reloader
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
          - metal1
  template:
    metadata:
      name: reloader-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://stakater.github.io/stakater-charts
        chart: reloader
        targetRevision: 2.2.20
        helm:
          releaseName: reloader
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/global-apps/reloader/global-values.yaml
          - $values/argocd/apps/global-apps/reloader/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: reloader-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
