# Migrated from fleet/global-apps/ipmi-exporter-targets
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ipmi-exporter-targets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: ipmi-exporter-targets-{{ .name }}
    spec:
      project: default
      source:
        repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        path: argocd/apps/global-apps/ipmi-exporter-targets
      destination:
        server: '{{ .server }}'
        namespace: cattle-monitoring-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
