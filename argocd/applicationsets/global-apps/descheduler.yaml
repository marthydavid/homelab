# Migrated from former Fleet bundle global-apps/descheduler
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: descheduler
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: descheduler-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://kubernetes-sigs.github.io/descheduler/
        chart: descheduler
        targetRevision: 0.37.0
        helm:
          releaseName: descheduler
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/global-apps/descheduler/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
