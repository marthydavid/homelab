# Migrated from fleet/gpu/nvidia/dcgm-exporter
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nvidia-dcgm-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: nvidia-dcgm-exporter-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
        chart: dcgm-exporter
        targetRevision: 4.8.4
        helm:
          releaseName: dcgm-exporter
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/nvidia/dcgm-exporter/values.yaml
          - $values/argocd/apps/nvidia/dcgm-exporter/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: nvidia-device-plugin
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
