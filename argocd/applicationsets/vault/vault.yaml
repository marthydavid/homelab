# Replaces the OCI-hosted Vault (vault.oci.marthy.xyz, down, see #1909) with HashiCorp Vault on nas.
# Storage: OCI Object Storage (buckets vault + vault-lock), auto-unseal: OCI KMS (vault key).
# OpenBao is not an option here: it has no OCI Object Storage backend.
# Bootstrap: the vault-oci Secret is created by hand, see argocd/apps/vault/vault/README.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: vault-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://helm.releases.hashicorp.com
        chart: vault
        targetRevision: 0.34.1
        helm:
          releaseName: vault
          valueFiles:
          - $values/argocd/apps/vault/vault/values.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: vault
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
