# ArgoCD manages its own install on the hub (nas).
# First install is done by hand with the same chart/values, see docs/argocd-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.12.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/argocd/apps/argocd/values.yaml
    - repoURL: https://github.com/marthydavid/homelab
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
