# Migrated from fleet/database/operator
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: database-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: database-operator-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        targetRevision: 0.29.1
        helm:
          releaseName: cloudnative-pg
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/database/operator/global-values.yaml
          - $values/argocd/apps/database/operator/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      # waves: operator (0) -> namespace (0) -> secrets (1) -> cluster (2); was database-secrets / database-cluster
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        path: argocd/apps/database/secrets
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        path: argocd/apps/database/cluster
      destination:
        server: '{{ .server }}'
        namespace: cnpg-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
