# Migrated from former Fleet bundle database/operator
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: database-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: database-operator-{{ .name }}
    spec:
      project: default
      sourceHydrator:
        drySource:
          repoURL: https://github.com/marthydavid/homelab
          targetRevision: main
          path: argocd/apps/database/operator/overlays/{{ .name }}
        syncSource:
          targetBranch: rendered
          path: rendered/{{ .name }}/database/operator
      destination:
        server: '{{ .server }}'
        namespace: cnpg-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
