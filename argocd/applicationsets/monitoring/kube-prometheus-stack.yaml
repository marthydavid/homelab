# Replaces rancher-monitoring (Fleet) on nas. Upstream kube-prometheus-stack, same object names.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: monitoring-kube-prometheus-stack-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 93.3.0
        helm:
          releaseName: rancher-monitoring
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/monitoring/kube-prometheus-stack/values.yaml
          - $values/argocd/apps/monitoring/kube-prometheus-stack/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: cattle-monitoring-system
      # The operator's webhooks/CA bundle are injected after creation.
      ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
