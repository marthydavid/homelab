# Migrated from fleet/gpu/intel/nfd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: intel-nfd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - metal1
  template:
    metadata:
      name: intel-nfd-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
        chart: node-feature-discovery
        targetRevision: 0.20.1
        helm:
          releaseName: node-feature-discovery
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/intel/nfd/global.yaml
          - $values/argocd/apps/intel/nfd/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
