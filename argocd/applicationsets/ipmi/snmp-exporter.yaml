# Migrated from former Fleet bundle ipmi/snmp-exporter
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ipmi-snmp-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchExpressions:
        - key: homelab/cluster
          operator: In
          values:
          - nas
  template:
    metadata:
      name: ipmi-snmp-exporter-{{ .name }}
    spec:
      project: default
      sources:
      - repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-snmp-exporter
        targetRevision: 9.19.0
        helm:
          releaseName: prometheus-snmp-exporter
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/argocd/apps/ipmi/snmp-exporter/values.yaml
          - $values/argocd/apps/ipmi/snmp-exporter/values-{{ .name }}.yaml
      - repoURL: https://github.com/marthydavid/homelab
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: cattle-monitoring-system
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    {{- if eq (index .metadata.labels "homelab/auto-sync") "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
